<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MonitoringLinux</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>MonitoringLinux</h1>
        <p>Remote Linux service monitor</p>
      </header>

      <section class="panel">
        <h2 id="target-form-title">Add target VM</h2>
        <form id="target-form" data-target-id="">
          <div class="row">
            <label>
              Machine name
              <input type="text" id="name" maxlength="80" placeholder="Automatic: VM_1, VM_2, ..." />
            </label>
            <label>
              IP address
              <input type="text" id="ip" placeholder="10.0.0.22" required />
            </label>
            <label>
              SSH user
              <input type="text" id="username" value="root" required />
            </label>
            <label>
              SSH port
              <input type="number" id="port" value="22" min="1" max="65535" />
            </label>
          </div>
          <div class="row">
            <label class="full-width">
              Services to monitor
              <input type="text" id="services" placeholder="sshd,nginx,httpd" required />
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" id="save-target">Save target</button>
            <button type="button" id="cancel-edit" class="button-secondary" hidden>Cancel</button>
            <span id="target-message" role="status" aria-live="polite"></span>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Monitored hosts</h2>
        <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Machine</th>
              <th>User</th>
              <th>Services</th>
              <th>Last status</th>
              <th>Last check</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="targets-body"></tbody>
        </table>
        </div>
      </section>

      <section class="panel">
        <h2>Service status</h2>
        <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Host</th>
              <th>Service</th>
              <th>Status</th>
              <th>Checked at</th>
            </tr>
          </thead>
          <tbody id="checks-body"></tbody>
        </table>
        </div>
      </section>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
